[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diploma-starters"
version = "0.1.0"
description = "Auditable starters for reputation aggregation and evidence retrieval research"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
audit = ["pandas>=2,<3", "pyarrow>=15"]
ann = ["numpy>=1.25,<3", "scipy>=1.11", "scikit-learn>=1.4", "threadpoolctl>=3", "faiss-cpu==1.12.0"]

[project.scripts]
diploma-starters = "diploma_starters.cli:main"
diploma-ann = "diploma_starters.ann_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
