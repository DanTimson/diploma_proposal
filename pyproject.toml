[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diploma-starters"
version = "0.1.0"
description = "Auditable starters for reputation aggregation and evidence retrieval research"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
audit = ["pandas>=2,<3", "pyarrow>=15"]

[project.scripts]
diploma-starters = "diploma_starters.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
